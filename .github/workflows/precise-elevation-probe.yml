name: Probe precise elevation sources

on:
  pull_request:
    branches: ["main"]
    paths:
      - "precise_elevation_probe.py"
      - ".github/workflows/precise-elevation-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - run: python precise_elevation_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precise-elevation-probe
          path: precise_elevation_probe_output
          retention-days: 7
