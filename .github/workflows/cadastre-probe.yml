name: Cadastre multipart probe

on:
  push:
    branches: ["main"]
    paths:
      - "cadastre_pilot/probe.py"
      - ".github/workflows/cadastre-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Query NSPD and count parcel components
        run: python cadastre_pilot/probe.py 2>&1 | tee cadastre_probe.log

      - name: Commit results
        if: always()
        run: |
          mkdir -p cadastre_result
          cp cadastre_probe.log cadastre_result/run.log || true
          git config user.name "cadastre-pilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cadastre_result
          git diff --cached --quiet || git commit -m "Add cadastral probe results [skip ci]"
          git push
