name: Cadastre multipart probe

on:
  pull_request:
    branches: ["main"]
    paths:
      - "cadastre_pilot/**"
      - ".github/workflows/cadastre-probe.yml"
  push:
    branches: ["main"]
    paths:
      - "cadastre_pilot/probe.py"
      - ".github/workflows/cadastre-probe.yml"
  workflow_dispatch:

concurrency:
  group: cadastre-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Query NSPD and count parcel components
        run: python cadastre_pilot/probe.py 2>&1 | tee cadastre_probe.log

      - name: Preserve logs
        if: always()
        run: |
          mkdir -p cadastre_result
          cp cadastre_probe.log cadastre_result/run.log || true

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadastre-probe
          path: cadastre_result
          if-no-files-found: warn
          retention-days: 7

      - name: Commit results on main push
        if: github.event_name == 'push'
        run: |
          git config user.name "cadastre-pilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cadastre_result
          git diff --cached --quiet || git commit -m "Add cadastral probe results [skip ci]"
          git push
