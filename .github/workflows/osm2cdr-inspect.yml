name: Inspect OSM2CDR cadastral converter

on:
  pull_request:
    branches: ["main"]
    paths:
      - "osm2cdr_browser_probe.py"
      - ".github/workflows/osm2cdr-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser libraries
        run: python -m pip install --upgrade playwright requests beautifulsoup4
      - name: Inspect page and submit a cadastral number
        run: python osm2cdr_browser_probe.py
      - name: Upload browser trace and extracted endpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm2cdr-inspect
          path: osm2cdr_result
          if-no-files-found: warn
          retention-days: 7
