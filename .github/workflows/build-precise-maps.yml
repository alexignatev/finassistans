name: Build precise cadastral maps

on:
  pull_request:
    branches: ["main"]
    paths:
      - "precise_maps/**"
      - ".github/workflows/build-precise-maps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade \
            requests numpy pillow matplotlib scipy rasterio shapely pyproj \
            pystac-client planetary-computer huggingface_hub fabdem geopandas
      - name: Restore cadastral geometry and builders
        run: |
          mkdir -p precise_maps/input
          base64 -d precise_maps/parcel_all_components.geojson.gz.b64 | gzip -d > precise_maps/input/parcel_all_components.geojson
          cat precise_maps/build_precise_maps_min.py.gz.b64.part* | base64 -d | gzip -d > precise_maps/build_precise_maps.py
          python -m py_compile precise_maps/build_precise_maps.py
          if compgen -G 'precise_maps/fabdem_patch.py.gz.b64.part*' > /dev/null; then
            cat precise_maps/fabdem_patch.py.gz.b64.part* | base64 -d | gzip -d > precise_maps/fabdem_patch.py
            python -m py_compile precise_maps/fabdem_patch.py
          fi
      - name: Build supplemental precise maps
        env:
          GDAL_HTTP_MAX_RETRY: "4"
          GDAL_HTTP_RETRY_DELAY: "2"
          GDAL_HTTP_MULTIRANGE: "YES"
          VSI_CACHE: "TRUE"
          VSI_CACHE_SIZE: "50000000"
        run: python precise_maps/build_precise_maps.py 2>&1 | tee precise_maps_build.log
      - name: Add FABDEM from the University of Bristol distribution
        if: hashFiles('precise_maps/fabdem_patch.py') != ''
        run: python precise_maps/fabdem_patch.py 2>&1 | tee -a precise_maps_build.log
      - name: Preserve build log
        if: always()
        run: |
          mkdir -p precise_maps_output
          cp precise_maps_build.log precise_maps_output/build.log || true
      - name: Upload precise maps package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precise-maps-22-43-010001-1229
          path: |
            precise_maps_output
            precise_maps_22_43_010001_1229.zip
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
