name: Build and publish precise DEM supplement

on:
  push:
    branches: ["precise-elevation-probe"]
    paths:
      - "precise_maps/**"
      - ".github/workflows/build-precise-maps-branch.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  OUTPUT_BRANCH: precise-maps-output

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: precise-elevation-probe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GIS dependencies
        run: |
          python -m pip install --upgrade \
            requests numpy pandas pillow matplotlib scipy \
            rasterio shapely pyproj pystac-client planetary-computer
      - name: Restore cadastral geometry
        run: |
          mkdir -p precise_maps/input
          base64 -d precise_maps/parcel_all_components.geojson.gz.b64 | gzip -d > precise_maps/input/parcel_all_components.geojson
          test -s precise_maps/input/parcel_all_components.geojson
      - name: Build exact source-grid DEM clips and terrain products
        run: python precise_maps/build_precise_maps_v2.py 2>&1 | tee precise_maps_build.log
      - name: Prepare publication branch
        if: always()
        run: |
          STATUS=success
          test -f precise_maps_22_43_010001_1229.zip || STATUS=failed
          mkdir -p /tmp/precise_publication
          cp precise_maps_build.log /tmp/precise_publication/build.log || true
          cp precise_maps_22_43_010001_1229.zip /tmp/precise_publication/ || true
          cp precise_maps_output/22_43_010001_1229/README.md /tmp/precise_publication/README.md || true
          cp precise_maps_output/22_43_010001_1229/build_report.json /tmp/precise_publication/build_report.json || true
          cp precise_maps_output/22_43_010001_1229/manifest.csv /tmp/precise_publication/manifest.csv || true
          find precise_maps_output/22_43_010001_1229/comparison -maxdepth 1 -type f -name '*.png' -exec cp {} /tmp/precise_publication/ \; 2>/dev/null || true
          printf '{"status":"%s","run_id":"%s","commit":"%s"}\n' "$STATUS" "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/precise_publication/status.json
          git config user.name "precise-dem-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan publication
          git rm -rf .
          cp -a /tmp/precise_publication/. .
          git add .
          git commit -m "Publish precise DEM supplement from run $GITHUB_RUN_ID"
          git push --force origin HEAD:${OUTPUT_BRANCH}
      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precise-maps-22-43-010001-1229
          path: |
            precise_maps_22_43_010001_1229.zip
            precise_maps_output
            precise_maps_build.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
