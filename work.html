<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Как мы работаем</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="header"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1 class="hero-title">Как мы работаем</h1>
                <p class="hero-subtitle">4-шаговый цикл работы</p>
            </div>
        </section>

        <section class="content">
            <div class="container">
                <div class="work-cycle">
                    <div class="cycle-step">
                        <div class="step-number">01</div>
                        <h3>Диагностика данных</h3>
                        <p>Описание этапа диагностики</p>
                    </div>
                    
                    <div class="cycle-step">
                        <div class="step-number">02</div>
                        <h3>Решения</h3>
                        <p>Описание этапа разработки решений</p>
                    </div>
                    
                    <div class="cycle-step">
                        <div class="step-number">03</div>
                        <h3>Внедрение</h3>
                        <p>Описание этапа внедрения</p>
                    </div>
                    
                    <div class="cycle-step">
                        <div class="step-number">04</div>
                        <h3>Контроль</h3>
                        <p>Описание этапа контроля</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="components/loader.js"></script>
    <script src="script.js"></script>
</body>
</html>
